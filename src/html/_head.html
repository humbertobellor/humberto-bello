<!-- IntersectionObserver: scroll-triggered reveal + nav section tracking -->
<script>
(function() {
  'use strict';

  // ---- Animation observer: triggers reveal on scroll-into-view ----
  var animObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        animObserver.unobserve(entry.target);
      }
    });
  }, { rootMargin: '-60px' });

  document.querySelectorAll('[data-wk-reveal]').forEach(function(el) {
    animObserver.observe(el);
  });

  // ---- Nav section-tracking observer ----
  var sectionIds = ['hero', 'skills', 'experience', 'clients'];
  var navObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var id = entry.target.id;
        document.querySelectorAll('.wk-nav-link[data-section]').forEach(function(link) {
          var active = link.getAttribute('data-section') === id;
          if (active) {
            link.setAttribute('data-active', '');
          } else {
            link.removeAttribute('data-active');
          }
        });
      }
    });
  }, { threshold: 0.35 });

  sectionIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) navObserver.observe(el);
  });

  // ---- Smooth scroll for nav links ----
  document.addEventListener('click', function(e) {
    var link = e.target.closest('[data-section]');
    if (link) {
      var id = link.getAttribute('data-section');
      var target = document.getElementById(id);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth' });
      }
    }
  });
})();
</script>
